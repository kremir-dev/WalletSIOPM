name: MobSF Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  mobsfscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run MobSF Security Scan
        uses: MobSF/mobsfscan@v1.0.1
        with:
          args: '. --sarif --output results.sarif'
        continue-on-error: true

      - name: Verify SARIF file
        run: |
          if [ ! -f results.sarif ]; then
            echo "Warning: results.sarif not generated"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"MobSF","version":"1.0"}},"results":[]}]}' > results.sarif
          else
            echo "SARIF file generated successfully"
          fi

      - name: Upload to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: 'security/mobsf'
          wait-for-processing: true
